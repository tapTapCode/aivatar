<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aivatar — Creative Workspace</title>
  <meta name="theme-color" content="#050913" />
  <link rel="icon" type="image/png" href="/ui/assets/brand/logo-aivatar.png" />
  <link rel="stylesheet" href="/ui/assets/app.css?v=5" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary navigation">
      <div class="brand-row">
        <a class="brand" href="#home" aria-label="Aivatar home">
          <img class="brand-logo" src="/ui/assets/brand/logo-aivatar.png" alt="Aivatar" />
          <span class="sr-only">Production workspace</span>
        </a>
        <button class="icon-btn sidebar-toggle" type="button" aria-label="Collapse navigation" title="Collapse navigation">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <nav class="nav-groups">
        <div class="nav-group">
          <p class="nav-label">Workspace</p>
          <button type="button" data-route="overview" class="nav-link is-active"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
          <button type="button" data-route="studio" class="nav-link"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></button>
          <button type="button" data-route="projects" class="nav-link"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Projects</span></button>
        </div>
        <div class="nav-group">
          <p class="nav-label">Create with AI</p>
          <button type="button" data-route="assets" class="nav-link"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg><span>Assets</span></button>
          <button type="button" data-route="templates" class="nav-link"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h5M8 16h8"/></svg><span>Templates</span></button>
          <button type="button" data-route="tools" class="nav-link"><svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/></svg><span>AI tools</span></button>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button type="button" data-route="settings" class="nav-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.04 1.55V20.3h-3v-.09A1.7 1.7 0 0 0 10.66 18.66a1.7 1.7 0 0 0-1.88.34l-.06.06L6.6 16.94l.06-.06A1.7 1.7 0 0 0 7 15a1.7 1.7 0 0 0-1.55-1.04h-.09v-3h.09A1.7 1.7 0 0 0 7 9.92a1.7 1.7 0 0 0-.34-1.88l-.06-.06L8.72 5.86l.06.06A1.7 1.7 0 0 0 10.66 6.26a1.7 1.7 0 0 0 1.04-1.55v-.09h3v.09a1.7 1.7 0 0 0 1.04 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.04h.09v3h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg><span>Settings</span></button>
        <button type="button" class="nav-link" id="help-button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.35 1.67c-.98.98-1.85 1.34-1.85 2.83M12 17h.01"/></svg><span>Help</span></button>
        <div class="workspace-card">
          <span class="avatar" aria-hidden="true">JJ</span>
          <label><span>Jumar’s workspace</span><input id="owner-id" type="text" value="local-development" autocomplete="off" aria-label="Workspace owner ID" /></label>
          <span class="status-dot" title="API status"></span>
        </div>
        <p class="runtime-status" id="health-line">Checking workspace…</p>
      </div>
    </aside>

    <main id="main" class="main-content">
      <header class="topbar">
        <button class="mobile-menu icon-btn" type="button" aria-label="Open navigation"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button class="command-trigger" id="command-trigger" type="button" aria-label="Search projects, templates, assets, and tools">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><span>Search projects, templates, and tools</span><kbd>⌘ K</kbd>
        </button>
        <div class="topbar-actions">
          <button class="icon-btn notification-btn" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
          <button type="button" class="btn primary" id="btn-new-video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></button>
        </div>
      </header>
      <div id="alert" class="alert" hidden role="status"></div>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="create-dialog" aria-labelledby="create-title">
    <form method="dialog" id="create-form">
      <button class="dialog-close icon-btn" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <p class="eyebrow">New project</p><h2 id="create-title">Start with a video</h2>
      <p class="muted">Create a workspace for an AI presenter, visual story, or social clip.</p>
      <label class="field"><span>Project name</span><input name="project_id" id="create-project-id" required pattern="[A-Za-z0-9_\-]{3,64}" placeholder="e.g. product-launch" /></label>
      <div class="dialog-actions"><button type="submit" value="cancel" class="btn secondary">Cancel</button><button type="submit" value="create" class="btn primary">Create project</button></div>
    </form>
  </dialog>

  <dialog id="command-dialog" class="command-dialog" aria-labelledby="command-title">
    <form method="dialog"><label class="command-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg><input id="command-input" type="search" placeholder="Search anything" autocomplete="off" /><kbd>esc</kbd></label></form>
    <div id="command-results" class="command-results" role="listbox" aria-label="Commands"></div>
  </dialog>

  <script src="/ui/assets/app.js?v=5" type="module"></script>
</body>
</html>
