[package]
name = "aivatar"
version = "0.5.0"
description = "Aivatar local-first production studio"
authors = ["Aivatar"]
edition = "2021"

[lib]
name = "aivatar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
