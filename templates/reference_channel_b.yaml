template_version: "1.0"
name: reference_channel_b
width: 1080
height: 1920
fps: 30
background_color: "#0F172A"
presenter_fit: cover
presenter_position: center
split:
  orientation: vertical
  avatar_side: bottom
  avatar_ratio: 0.45
  visual_ratio: 0.55
  divider_width_px: 6
  divider_color: "#E2E8F0"
  safe_margin_px: 40
  avatar_crop: medium_closeup
  visual_fit: cover
captions:
  enabled: true
  font: DejaVu Sans
  size_px: 58
  color: "#FFFFFF"
  stroke_color: "#000000"
  stroke_width_px: 4
  bottom_margin_px: 90
  max_chars_per_line: 30
audio:
  target_lufs: -16.0
  true_peak_db: -1.5
  background_music_lufs: -29.0
  sample_rate: 48000
intro_uri: null
outro_uri: null
logo_uri: null
logo_position: top_right
transitions: [cut]
static_visual_motion: slow_pan
