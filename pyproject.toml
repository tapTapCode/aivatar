[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aivatar"
version = "0.6.0"
description = "Aivatar local-first production studio -- Python pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-anyio",
    "anyio[trio]",
    "pyinstaller>=6,<7",
]

[project.scripts]
aivatar-api = "pipeline.sidecar:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "migrations*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
