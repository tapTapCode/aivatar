[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "exact-scene-video-pipeline"
version = "0.1.0"
description = "Code-first, containerized AI video orchestration with exact scene-format routing"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "Proprietary"}
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.19.1",
  "argon2-cffi==25.1.0",
  "asyncpg==0.31.0",
  "cryptography==50.0.0",
  "fastapi==0.115.12",
  "greenlet==3.5.5",
  "httpx==0.28.1",
  "PyJWT==2.13.0",
  "python-multipart==0.0.20",
  "pydantic==2.13.4",
  "pydantic-settings==2.9.1",
  "PyYAML==6.0.2",
  "redis==6.2.0",
  "resend==2.36.0",
  "SQLAlchemy==2.0.52",
  "structlog==25.4.0",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "ruff==0.11.13",
]
s3 = ["boto3==1.38.32"]
gpu-observability = ["nvidia-ml-py==12.575.51"]

[project.scripts]
video-api = "src.api.main:run"
video-worker = "src.workers.main:run"
video-demo = "scripts.generate_demo:run"

[tool.hatch.build.targets.wheel]
packages = ["src", "benchmarks", "scripts"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: requires a configured NVIDIA GPU and model weights",
  "slow: long-running integration test",
  "media: requires ffmpeg and ffprobe",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
