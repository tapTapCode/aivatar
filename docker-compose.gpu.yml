x-gpu-worker: &gpu-worker
  restart: unless-stopped
  init: true
  stop_grace_period: 60s
  environment: &gpu-environment
    PROVIDER_MODE: configured
    MODEL_CACHE_ROOT: /models
  volumes:
    - model-cache:/models
    - pipeline-data:/data
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PROVIDER_MODE: workers
      QUEUE_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_ROOT: /data/assets
      WORK_ROOT: /data/work
      TEMPLATE_ROOT: /app/templates
      AVATAR_REGISTRY_ROOT: /data/avatars
      VOICE_REGISTRY_ROOT: /data/voices
      MEDIA_REGISTRY_ROOT: /data/authorized-media
    volumes:
      - pipeline-data:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  image-worker:
    <<: *gpu-worker
    build:
      context: .
      dockerfile: docker/image-worker.Dockerfile
      args:
        MODEL_REVISION: ${FLUX2_MODEL_REVISION:-PIN_REQUIRED}
        MODEL_ADAPTER: ${FLUX2_MODEL_ADAPTER:-}
    environment:
      <<: *gpu-environment
      MODEL_ADAPTER: ${FLUX2_MODEL_ADAPTER:-}

  video-worker:
    <<: *gpu-worker
    build:
      context: .
      dockerfile: docker/video-worker.Dockerfile
      args:
        MODEL_REVISION: ${LTX_MODEL_REVISION:-PIN_REQUIRED}
        MODEL_ADAPTER: ${LTX_MODEL_ADAPTER:-}
    environment:
      <<: *gpu-environment
      MODEL_ADAPTER: ${LTX_MODEL_ADAPTER:-}

  tts-worker:
    <<: *gpu-worker
    build:
      context: .
      dockerfile: docker/tts-worker.Dockerfile
      args:
        MODEL_REVISION: ${CHATTERBOX_MODEL_REVISION:-PIN_REQUIRED}
        MODEL_ADAPTER: ${CHATTERBOX_MODEL_ADAPTER:-}
    environment:
      <<: *gpu-environment
      MODEL_ADAPTER: ${CHATTERBOX_MODEL_ADAPTER:-}
      VOICE_REGISTRY_ROOT: /data/voices
      CHATTERBOX_DEVICE: ${CHATTERBOX_DEVICE:-cuda}

  lipsync-worker:
    <<: *gpu-worker
    build:
      context: .
      dockerfile: docker/lipsync-worker.Dockerfile
      args:
        MODEL_REVISION: ${MUSETALK_MODEL_REVISION:-PIN_REQUIRED}
        MODEL_ADAPTER: ${MUSETALK_MODEL_ADAPTER:-}
    environment:
      <<: *gpu-environment
      MODEL_ADAPTER: ${MUSETALK_MODEL_ADAPTER:-}
      MUSETALK_SOURCE_ROOT: /opt/MuseTalk
      MUSETALK_MODELS_ROOT: /models
      MUSETALK_BBOX_SHIFT: ${MUSETALK_BBOX_SHIFT:-0}
      MUSETALK_TIMEOUT_SECONDS: ${MUSETALK_TIMEOUT_SECONDS:-3600}

  render-worker:
    build:
      context: .
      dockerfile: docker/render-worker.Dockerfile
    environment:
      PROVIDER_MODE: configured
    volumes:
      - pipeline-data:/data
    init: true
    stop_grace_period: 30s

volumes:
  model-cache:
  pipeline-data:
  redis-data:
